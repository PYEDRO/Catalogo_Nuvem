# CI/CD - Catálogo Inteligente
#
# APRIMORAMENTO [CICD-1]: Pipeline atualizado com:
#   - Job de lint backend (flake8) e frontend (ESLint + TypeScript type-check)
#   - Coverage report com pytest-cov — falha se cobertura < 70%
#   - Jobs de lint e test em paralelo para reduzir tempo de pipeline
#   - Separação clara entre quality-gate (lint+test) e deploy
#
# ESTRATÉGIA DE DEPLOY:
#   - Backend: Rolling deployment no Cloud Run (zero-downtime, instâncias min=1 em produção)
#   - Frontend: Firebase Hosting com CDN global (canal "live" = produção imediata)
#   - Rollback: Cloud Run mantém revisão anterior — rollback via `gcloud run services update-traffic`
#
# GATES: deploy só ocorre se lint + testes passarem (needs: [lint-backend, lint-frontend, test-backend])

name: CI/CD - Catálogo Inteligente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT_ID: catalogo-unifor-1629
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: catalogo-backend
  IMAGE: us-central1-docker.pkg.dev/catalogo-unifor-1629/catalogo/backend

# ─────────────────────────────────────────────────────────────────────────────
# QUALITY GATE — lint e type-check rodam em paralelo com os testes
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  lint-backend:
    name: "Lint Backend (flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências + pytest
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # flake8: max-line-length=120 alinhado com Black; ignora E501 em strings longas
      - name: Lint com flake8
        working-directory: backend
        run: |
          flake8 app/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --statistics

  lint-frontend:
    name: "Lint Frontend (ESLint + TypeScript)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install

      # TypeScript type-check — falha em erros de tipagem antes do build
      - name: Type-check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    name: "Testes Backend + Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt

      # pytest-cov: gera relatório de cobertura; --cov-fail-under=70 bloqueia pipeline se < 70%
      - name: Executar testes com cobertura
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70
        env:
          GCP_PROJECT_ID: test-project
          FIREBASE_CREDENTIALS: ""
          ENVIRONMENT: test

      # Upload do relatório de cobertura para GitHub (visível no PR)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY BACKEND — só executa após todos os quality gates passarem
# ─────────────────────────────────────────────────────────────────────────────

  build-and-deploy-backend:
    name: "Build e Deploy Backend (Cloud Run)"
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    # Só executa no merge para main E quando o secret GCP_SA_KEY está configurado
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build imagem Docker
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push para Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Rolling deployment: Cloud Run cria nova revisão e transfere tráfego gradualmente.
      # Em caso de falha de health-check, a revisão anterior recebe 100% do tráfego (rollback automático).
      - name: Deploy no Cloud Run (rolling)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}" \
            --set-env-vars="ENVIRONMENT=production" \
            --set-env-vars="ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" \
            --set-secrets="FIREBASE_CREDENTIALS=firebase-credentials:latest" \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60

      - name: Verificar health check pós-deploy
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl --fail --silent "$SERVICE_URL/health" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Health check falhou: {data}'
          print('Health check OK:', data)
          "

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY FRONTEND — só executa após lint-frontend e deploy do backend passarem
# ─────────────────────────────────────────────────────────────────────────────

  deploy-frontend:
    name: "Deploy Frontend (Firebase Hosting)"
    runs-on: ubuntu-latest
    needs: [lint-frontend, build-and-deploy-backend]
    # Só executa no merge para main E quando o secret FIREBASE_SERVICE_ACCOUNT está configurado
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: frontend
        run: npm install

      - name: Build produção
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Firebase Hosting com CDN global — deploy imediato no canal "live" (produção)
      - name: Deploy para Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.GCP_PROJECT_ID }}
          channelId: live
